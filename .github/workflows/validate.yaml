# Validate the Renovate presets in this repository
---
name: Validate Presets

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate_presets:
    name: Validate Renovate presets
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.1.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: "lts/*"
      - run: npx --yes --package renovate@latest -- renovate-config-validator --strict *.json
